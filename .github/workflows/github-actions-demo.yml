name: Tests Workflow

on: 
  push:
    branches:     
    - unit_tests
    - release/*  
  pull_request:
    branches:     
    - master
    - release/*      
    - develop

jobs:  
  lint-and-test:
    runs-on: ubuntu-latest
    
    env:  
      FULL_NAME: "Lukashenko Kirill Denisovich"
      GROUP_NUMBER: "M3117"
      GITHUB_USERNAME: ${{ github.actor }}
      
    steps:     
    - name: Print Name and Group
      run: |          
        echo "Full Name: ${{ env.FULL_NAME }}"
        echo "Group Number: ${{ env.GROUP_NUMBER }}"          
        echo "GitHub Username: ${{ env.GITHUB_USERNAME }}"
        
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python        
      uses: actions/setup-python@v4
      with:    
        python-version: '3.13'
        
    - name: Install dependencies
      run: |          
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Check code formatting with flake8        
      run: |
        flake8 .
        
    - name: Run unit tests        
      run: |
          python -m unittest discover -s unit_tests -p "test_*.py"
